<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Oversea ClockIn</title>
    <meta name="description" content="Application de pointage Oversea ClockIn" />
    <meta property="og:title" content="Oversea ClockIn" />
    <meta property="og:description" content="Application de pointage Oversea ClockIn" />
    <meta property="og:type" content="website" />
    <!-- Un seul fichier pour tout -->
    <link rel="icon" href="/LOGO.png" />
    <link rel="apple-touch-icon" href="/LOGO.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#110195" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ClockIn" />
  </head>
  <body>
    <!-- Instant Native Splash Screen -->
    <div id="splash-screen" style="
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      transition: opacity 0.5s ease;
      user-select: none;
      -webkit-user-select: none;
    ">
      <!-- Horloge SVG Minimaliste -->
      <div style="position: relative; width: 130px; height: 130px;">
        <svg viewBox="0 0 200 200" style="width: 100%; height: 100%;">
          <!-- Cercle extérieur - Bleu #110195 -->
          <circle cx="100" cy="100" r="90" fill="none" stroke="#110195" stroke-width="5" />
          <!-- Cercle intérieur (cadran) -->
          <circle cx="100" cy="100" r="82" fill="none" stroke="#E5E7EB" stroke-width="1" />
          <!-- Repères des 12 heures -->
          <circle cx="100" cy="22" r="3" fill="#FC9905" />
          <circle cx="139" cy="32.45" r="1.5" fill="#D1D5DB" />
          <circle cx="167.55" cy="61" r="1.5" fill="#D1D5DB" />
          <circle cx="178" cy="100" r="3" fill="#FC9905" />
          <circle cx="167.55" cy="139" r="1.5" fill="#D1D5DB" />
          <circle cx="139" cy="167.55" r="1.5" fill="#D1D5DB" />
          <circle cx="100" cy="178" r="3" fill="#FC9905" />
          <circle cx="61" cy="167.55" r="1.5" fill="#D1D5DB" />
          <circle cx="32.45" cy="139" r="1.5" fill="#D1D5DB" />
          <circle cx="22" cy="100" r="3" fill="#FC9905" />
          <circle cx="32.45" cy="61" r="1.5" fill="#D1D5DB" />
          <circle cx="61" cy="32.45" r="1.5" fill="#D1D5DB" />

          <!-- Aiguille des HEURES - Orange #FC9905 -->
          <g class="splash-hours-hand" style="transform-origin: 100px 100px;">
            <line x1="100" y1="100" x2="100" y2="60" stroke="#FC9905" stroke-width="4" stroke-linecap="round" />
          </g>

          <!-- Aiguille des MINUTES - Orange #FC9905 -->
          <g class="splash-minutes-hand" style="transform-origin: 100px 100px;">
            <line x1="100" y1="100" x2="100" y2="45" stroke="#FC9905" stroke-width="2.5" stroke-linecap="round" />
          </g>

          <!-- Aiguille des SECONDES - Fine -->
          <g class="splash-seconds-hand" style="transform-origin: 100px 100px;">
            <line x1="100" y1="100" x2="100" y2="35" stroke="#FC9905" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
          </g>

          <!-- Centre de l'horloge -->
          <circle cx="100" cy="100" r="5" fill="#FC9905" />
          <circle cx="100" cy="100" r="2.5" fill="#110195" />
        </svg>
      </div>

      <!-- Titre bicolore : Oversea en bleu, ClockIn en orange -->
      <h1 style="
        margin-top: 20px;
        font-size: 22px;
        font-family: serif;
        font-weight: bold;
        letter-spacing: -0.5px;
        margin-bottom: 0;
      ">
        <span style="color: #110195;">Oversea</span>
        <span style="color: #FC9905;"> ClockIn</span>
      </h1>

      <!-- Points de chargement uniquement (sans le texte "Chargement...") -->
      <div style="display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 16px;">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: #FC9905; animation: splashBounce 0.6s infinite alternate; animation-delay: -0.3s;"></span>
        <span style="width: 8px; height: 8px; border-radius: 50%; background: #110195; animation: splashBounce 0.6s infinite alternate; animation-delay: -0.15s;"></span>
        <span style="width: 8px; height: 8px; border-radius: 50%; background: #FC9905; animation: splashBounce 0.6s infinite alternate;"></span>
      </div>
    </div>

    <!-- Styles du splash screen -->
    <style>
      @keyframes splashBounce {
        0% { transform: translateY(0); }
        100% { transform: translateY(-8px); }
      }
      @keyframes splashRotateHours {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes splashRotateMinutes {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes splashRotateSeconds {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .splash-hours-hand { animation: splashRotateHours 16s linear infinite; }
      .splash-minutes-hand { animation: splashRotateMinutes 4s linear infinite; }
      .splash-seconds-hand { animation: splashRotateSeconds 1.2s cubic-bezier(0.4, 0.0, 0.2, 1) infinite; }
    </style>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
