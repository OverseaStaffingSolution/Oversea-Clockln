<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Oversea ClockIn</title>
    <meta name="description" content="Application de pointage Oversea ClockIn" />
    <meta property="og:title" content="Oversea ClockIn" />
    <meta property="og:description" content="Application de pointage Oversea ClockIn" />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#110195" />
    <meta name="msapplication-TileColor" content="#110195" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ClockIn" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- PWA Manifest -->
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Splash Screen iOS -->
    <link rel="apple-touch-startup-image" media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2)" href="/splash/splash-640x1136.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)" href="/splash/splash-750x1334.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3)" href="/splash/splash-1242x2208.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)" href="/splash/splash-1125x2436.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2)" href="/splash/splash-828x1792.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3)" href="/splash/splash-1242x2688.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2)" href="/splash/splash-1536x2048.png" />
  </head>
  <body>
    <!-- Instant Native Splash Screen -->
    <div id="splash-screen" style="
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      transition: opacity 0.5s ease;
      user-select: none;
      -webkit-user-select: none;
    ">
      <!-- Horloge SVG Minimaliste -->
      <div style="position: relative; width: 130px; height: 130px;">
        <svg viewBox="0 0 200 200" style="width: 100%; height: 100%;">
          <!-- Cercle extérieur - Bleu #110195 -->
          <circle cx="100" cy="100" r="90" fill="none" stroke="#110195" stroke-width="5" />
          <!-- Cercle intérieur (cadran) -->
          <circle cx="100" cy="100" r="82" fill="none" stroke="#E5E7EB" stroke-width="1" />
          <!-- Repères des 12 heures -->
          <circle cx="100" cy="22" r="3" fill="#FC9905" />
          <circle cx="139" cy="32.45" r="1.5" fill="#D1D5DB" />
          <circle cx="167.55" cy="61" r="1.5" fill="#D1D5DB" />
          <circle cx="178" cy="100" r="3" fill="#FC9905" />
          <circle cx="167.55" cy="139" r="1.5" fill="#D1D5DB" />
          <circle cx="139" cy="167.55" r="1.5" fill="#D1D5DB" />
          <circle cx="100" cy="178" r="3" fill="#FC9905" />
          <circle cx="61" cy="167.55" r="1.5" fill="#D1D5DB" />
          <circle cx="32.45" cy="139" r="1.5" fill="#D1D5DB" />
          <circle cx="22" cy="100" r="3" fill="#FC9905" />
          <circle cx="32.45" cy="61" r="1.5" fill="#D1D5DB" />
          <circle cx="61" cy="32.45" r="1.5" fill="#D1D5DB" />

          <!-- Aiguille des HEURES - Orange #FC9905 -->
          <g class="splash-hours-hand" style="transform-origin: 100px 100px;">
            <line x1="100" y1="100" x2="100" y2="60" stroke="#FC9905" stroke-width="4" stroke-linecap="round" />
          </g>

          <!-- Aiguille des MINUTES - Orange #FC9905 -->
          <g class="splash-minutes-hand" style="transform-origin: 100px 100px;">
            <line x1="100" y1="100" x2="100" y2="45" stroke="#FC9905" stroke-width="2.5" stroke-linecap="round" />
          </g>

          <!-- Aiguille des SECONDES - Fine -->
          <g class="splash-seconds-hand" style="transform-origin: 100px 100px;">
            <line x1="100" y1="100" x2="100" y2="35" stroke="#FC9905" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
          </g>

          <!-- Centre de l'horloge -->
          <circle cx="100" cy="100" r="5" fill="#FC9905" />
          <circle cx="100" cy="100" r="2.5" fill="#110195" />
        </svg>
      </div>

      <!-- Titre -->
      <h1 style="
        margin-top: 20px;
        font-size: 22px;
        font-family: serif;
        font-weight: bold;
        color: #110195;
        letter-spacing: -0.5px;
        margin-bottom: 0;
      ">Oversea ClockIn</h1>

      <!-- Sous-titre -->
      <p style="
        margin-top: 4px;
        font-size: 13px;
        color: #9CA3AF;
        font-weight: 300;
        letter-spacing: 0.5px;
        margin-bottom: 0;
      ">Chargement...</p>

      <!-- Points de chargement -->
      <div style="display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 16px;">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: #FC9905; animation: splashBounce 0.6s infinite alternate; animation-delay: -0.3s;"></span>
        <span style="width: 8px; height: 8px; border-radius: 50%; background: #110195; animation: splashBounce 0.6s infinite alternate; animation-delay: -0.15s;"></span>
        <span style="width: 8px; height: 8px; border-radius: 50%; background: #FC9905; animation: splashBounce 0.6s infinite alternate;"></span>
      </div>
    </div>

    <!-- Styles du splash screen -->
    <style>
      @keyframes splashBounce {
        0% { transform: translateY(0); }
        100% { transform: translateY(-8px); }
      }
      @keyframes splashRotateHours {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes splashRotateMinutes {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes splashRotateSeconds {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .splash-hours-hand { animation: splashRotateHours 16s linear infinite; }
      .splash-minutes-hand { animation: splashRotateMinutes 4s linear infinite; }
      .splash-seconds-hand { animation: splashRotateSeconds 1.2s cubic-bezier(0.4, 0.0, 0.2, 1) infinite; }
    </style>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
